<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommender</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2b6cb0;
            padding: 1rem;
            color: white;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 1rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #90cdf4;
        }

        nav .user-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        nav .username {
            font-size: 0.9rem;
            color: white;
        }

        nav .logout-button {
            padding: 0.5rem 1rem;
            background-color: #e53e3e;
            border-radius: 4px;
            text-decoration: none;
            color: white;
            transition: background-color 0.3s;
            font-size: 0.9rem;
        }

        nav .logout-button:hover {
            background-color: #c53030;
        }

        /* Footer */
        footer {
            text-align: center;
            background-color: #2d3748;
            color: white;
            padding: 1rem;
            margin-top: 2rem;
        }

        footer p {
            margin: 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav>
        <div>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('recommend') }}">Recommend</a>
            <a href="{{ url_for('describe') }}">Describe</a>
            <a href="{{ url_for('movies_page') }}">Movies</a>
        </div>
        <div class="user-section">
            <span class="username">👋 {{ session['username'] }}</span>
            <a href="{{ url_for('logout') }}" class="logout-button">Logout</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="content">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer>
        <p>© anmol guragain</p>
        <p>Movie Recommendation App</p>
    </footer>
</body>
</html>
